spring.datasource.url=jdbc:h2:mem:skilllink;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
api.security.secret=test-secret-with-at-least-32-characters
api.security.password-reset-secret=test-reset-secret-with-at-least-32-characters
spring.rabbitmq.listener.simple.auto-startup=false
management.endpoint.health.show-details=never
