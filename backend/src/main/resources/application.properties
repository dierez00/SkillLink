spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skilllink}
spring.datasource.username=${DB_USERNAME:skilllink}
spring.datasource.password=${DB_PASSWORD:skilllink}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

api.security.secret=${JWT_SECRET}
api.security.password-reset-secret=${PASSWORD_RESET_SECRET:${JWT_SECRET}}
api.security.expiration-minutes=${JWT_EXPIRATION_MINUTES:180}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8081}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never
server.forward-headers-strategy=native

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
